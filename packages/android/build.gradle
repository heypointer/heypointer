plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

// Applied by a host app's Gradle build, which supplies the plugin versions. See README.md.
// Needs Android Gradle Plugin 7.1 or newer (publishing.singleVariant).
group = 'com.heypointer'
version = '0.2.0'

android {
    namespace 'com.heypointer.android'
    compileSdk 34

    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { buildConfig false }
    testOptions { unitTests.returnDefaultValues = true }
    publishing {
        singleVariant('release') { withSourcesJar() }
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.7.22'
    // org.json first: the Android stub of it throws "not mocked" in JVM unit tests.
    testImplementation 'org.json:json:20231013'
    testImplementation 'junit:junit:4.13.2'
}

// ./gradlew :heypointer-android:publishToMavenLocal  ->  ~/.m2/repository/com/heypointer/heypointer-android/0.2.0/
// Local only. Nothing here uploads to a remote repository.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.heypointer'
                artifactId = 'heypointer-android'
                version = '0.2.0'
                pom {
                    name = 'HeyPointer for Android'
                    description = 'Walks a user through the real screen of an Android app, one control at a time. It asks a HeyPointer server for grounded steps, spotlights the real control and never taps or types for the user.'
                    url = 'https://github.com/heypointer/heypointer'
                    licenses {
                        license {
                            // Placeholder: the repository has no license file yet. Replace before any public release.
                            name = 'UNLICENSED'
                            url = 'https://github.com/heypointer/heypointer'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/heypointer/heypointer.git'
                        developerConnection = 'scm:git:ssh://git@github.com/heypointer/heypointer.git'
                        url = 'https://github.com/heypointer/heypointer'
                    }
                }
            }
        }
    }
}
