plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
    id 'signing'
}

// Applied by a host app's Gradle build, which supplies the plugin versions. See README.md.
// Needs Android Gradle Plugin 7.1 or newer (publishing.singleVariant).
group = 'com.heypointer'
version = '0.2.0'

android {
    namespace 'com.heypointer.android'
    compileSdk 34

    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { buildConfig false }
    testOptions { unitTests.returnDefaultValues = true }
    publishing {
        singleVariant('release') { withSourcesJar() }
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.7.22'
    // org.json first: the Android stub of it throws "not mocked" in JVM unit tests.
    testImplementation 'org.json:json:20231013'
    testImplementation 'junit:junit:4.13.2'
}

// ./gradlew :heypointer-android:publishToMavenLocal  ->  ~/.m2/repository/com/heypointer/heypointer-android/0.2.0/
// ./gradlew :heypointer-android:publishReleasePublicationToCentralStagingRepository  ->  build/central-staging/
// Nothing here uploads to a remote repository. The maintainers zip build/central-staging and upload it to the
// Sonatype Central Portal by hand.

// Central requires a -javadoc.jar. The library is Kotlin and the docs live on the site, so the jar carries a pointer.
def javadocPlaceholderDir = layout.buildDirectory.dir('javadoc-placeholder')
tasks.register('writeJavadocPlaceholder') {
    def out = javadocPlaceholderDir
    outputs.dir(out)
    doLast {
        def dir = out.get().asFile
        dir.mkdirs()
        new File(dir, 'README.txt').text = 'HeyPointer for Android (com.heypointer:heypointer-android).\n' +
            'API documentation: https://heypointer.com/docs/\n' +
            'Source: https://github.com/heypointer/heypointer\n'
    }
}
tasks.register('javadocJar', Jar) {
    dependsOn 'writeJavadocPlaceholder'
    archiveClassifier = 'javadoc'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from javadocPlaceholderDir
}

afterEvaluate {
    publishing {
        repositories {
            maven {
                name = 'CentralStaging'
                url = layout.buildDirectory.dir('central-staging')
            }
        }
        publications {
            release(MavenPublication) {
                from components.release
                artifact tasks.named('javadocJar')
                groupId = 'com.heypointer'
                artifactId = 'heypointer-android'
                version = '0.2.0'
                pom {
                    name = 'HeyPointer for Android'
                    description = 'Walks a user through the real screen of an Android app, one control at a time. It asks a HeyPointer server for grounded steps, spotlights the real control and never taps or types for the user.'
                    url = 'https://github.com/heypointer/heypointer'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }
                    developers {
                        developer {
                            id = 'heypointer'
                            name = 'HeyPointer'
                            email = 'admin@heypointer.com'
                            url = 'https://heypointer.com'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/heypointer/heypointer.git'
                        developerConnection = 'scm:git:ssh://git@github.com/heypointer/heypointer.git'
                        url = 'https://github.com/heypointer/heypointer'
                    }
                }
            }
        }
    }

    // Signing is off unless a key is supplied, so publishToMavenLocal and host-app builds never need one.
    // Pass the ASCII-armored private key as -PsigningInMemoryKey or ORG_GRADLE_PROJECT_signingInMemoryKey,
    // with signingPassword (and optionally signingInMemoryKeyId). Nothing is read from files.
    def signingKey = project.findProperty('signingInMemoryKey')
    if (signingKey) {
        signing {
            useInMemoryPgpKeys(project.findProperty('signingInMemoryKeyId') ?: null, signingKey.toString(), (project.findProperty('signingPassword') ?: '').toString())
            sign publishing.publications.release
        }
    }
}
