name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lockfile is written by npm 11; Node 22's bundled npm 10 rejects it (optional @emnapi packages).
      - run: npm install -g npm@11.6.2
      - run: npm ci
      # The packages' type declarations are built by `build`, which the samples and the wrappers need to typecheck.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6.4
      - run: gradle :heypointer-android:testDebugUnitTest
